# Déploie le build webpack (dist/web) sur GitHub Pages.
# Dans le dépôt : Settings → Pages → Source : « GitHub Actions » (pas « Deploy from a branch »).
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build web bundle
        env:
          # Projet hébergé en https://<user>.github.io/<nom-du-dépôt>/
          WEB_PUBLIC_PATH: /${{ github.event.repository.name }}/
        run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
