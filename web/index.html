<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HackCable</title>
    <link rel="icon" href="./assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet" />
    <!-- CSS will be auto-injected -->
    <!-- JS will be auto-injected -->
</head>
<body>
    <header class="hackCable-app-header">
        <div class="hackCable-app-toolbar">
            <div class="hackCable-app-toolbar-group">
                <button type="button" id="update-catalog">
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3h-2.1A7 7 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 12v3l4-4-4-4v3a5 5 0 0 1-5-5H5a7 7 0 0 0 7 7z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Mise à jour</span>
                </button>
            </div>
            <div class="hackCable-app-toolbar-group">
                <button type="button" id="save">
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M19 12v7H5v-7H3v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zm-6 .67 2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Sauvegarder</span>
                </button>
                <button type="button" id="restore">
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M5 12V5h14v7h2V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v7h2zm6-.67-2.59 2.58L7 12.5l5-5 5 5-1.41 1.41L13 11.33V21h-2v-9.67z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Charger fichier</span>
                </button>
                <button type="button" id="export-image">
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Exporter l’image</span>
                </button>
                <button type="button" id="undo" disabled>
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Annuler</span>
                </button>
                <button type="button" id="redo" disabled>
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22l2.36.78c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Rétablir</span>
                </button>
            </div>
            <div class="hackCable-app-toolbar-group hackCable-app-toolbar-group--end">
                <label class="hackCable-app-minimap-toggle" for="show-minimap">
                    <input type="checkbox" id="show-minimap" checked />
                    <span class="hackCable-btn-icon hackCable-minimap-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M3 5v14h18V5H3zm16 12H5V7h14v10zM7 9h4v2H7V9zm0 4h10v2H7v-2zm6-4h4v2h-4V9z"/></svg>
                    </span>
                    <span id="show-minimap-label" class="hackCable-btn-label">Minicarte</span>
                </label>
                <label class="hackCable-app-language" for="language-select">
                    <span class="hackCable-btn-icon hackCable-language-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.93 6h-3.18a15.7 15.7 0 0 0-1.35-3.5A8.03 8.03 0 0 1 18.93 8zM12 4c.9 0 2.23 1.84 2.9 4H9.1C9.77 5.84 11.1 4 12 4zM4.26 14a8.02 8.02 0 0 1 0-4h3.4c-.1.65-.16 1.32-.16 2s.06 1.35.16 2h-3.4zm.81 2h3.18c.3 1.25.74 2.45 1.35 3.5A8.03 8.03 0 0 1 5.07 16zm3.18-8H5.07a8.03 8.03 0 0 1 4.53-3.5A15.7 15.7 0 0 0 8.25 8zM12 20c-.9 0-2.23-1.84-2.9-4h5.8c-.67 2.16-2 4-2.9 4zm3.59-6H8.41A13.6 13.6 0 0 1 8.25 12c0-.68.06-1.35.16-2h7.18c.1.65.16 1.32.16 2s-.06 1.35-.16 2zm.16 5.5c.61-1.05 1.05-2.25 1.35-3.5h3.18a8.03 8.03 0 0 1-4.53 3.5zM16.34 8c.3-1.25.74-2.45 1.35-3.5A8.03 8.03 0 0 1 18.93 8h-2.59z"/></svg>
                    </span>
                    <span class="hackCable-app-language-label hackCable-btn-label" id="language-select-label">Langue</span>
                    <select id="language-select" aria-labelledby="language-select-label">
                        <option value="fr_fr">Français</option>
                        <option value="en_us">English</option>
                        <option value="es_es">Español</option>
                        <option value="ar_sa">العربية</option>
                    </select>
                </label>
                <button type="button" id="a11y-open" class="hackCable-a11y-open-btn" aria-haspopup="dialog">
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm8 7h-5v12h-2v-6h-2v6H9V9H4V7h16v2z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">Accessibilité</span>
                </button>
                <button type="button" id="about-open" class="hackCable-about-open-btn" aria-haspopup="dialog">
                    <span class="hackCable-btn-icon" aria-hidden="true">
                        <svg class="hackCable-btn-svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    </span>
                    <span class="hackCable-btn-label">À propos</span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div id="hackCable"></div>
    </main>
    <footer>
        <div></div>
    </footer>
</body>
</html>
